server:
  port: ${SERVER_PORT}
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE}
        same-site: lax

spring:
  application:
    name: frontend
  cloud:
    loadbalancer:
      cache:
        enabled: false
  http:
    clients:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT}
    serviceclient:
      identity-service:
        base-url: ${IDENTITY_SERVICE_BASE_URL}
      identity-account-service:
        base-url: ${IDENTITY_SERVICE_BASE_URL}
      learning-service:
        base-url: ${LEARNING_SERVICE_BASE_URL}
      learning-ai-service:
        base-url: ${LEARNING_SERVICE_BASE_URL}
  data:
    redis:
      host: ${SESSION_REDIS_HOST}
      port: ${SESSION_REDIS_PORT}
      database: ${SESSION_REDIS_DATABASE}
      username: ${SESSION_REDIS_USERNAME}
      password: ${SESSION_REDIS_PASSWORD}
      connect-timeout: ${SESSION_REDIS_CONNECT_TIMEOUT}
      timeout: ${SESSION_REDIS_COMMAND_TIMEOUT}
      ssl:
        enabled: ${SESSION_REDIS_SSL_ENABLED}
  session:
    timeout: ${SESSION_TIMEOUT}
    data:
      redis:
        namespace: ${SESSION_REDIS_NAMESPACE}
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          no-cache: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

eureka:
  client:
    enabled: ${EUREKA_ENABLED}
    register-with-eureka: false
    fetch-registry: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

clients:
  identity:
    username: ${FRONTEND_USERNAME}
    password: ${FRONTEND_PASSWORD}

auth:
  access-token-refresh:
    refresh-before-expiry: ${ACCESS_TOKEN_REFRESH_BEFORE_EXPIRY}
    lock:
      wait-timeout: ${ACCESS_TOKEN_REFRESH_LOCK_WAIT_TIMEOUT}
      poll-interval: ${ACCESS_TOKEN_REFRESH_LOCK_POLL_INTERVAL}
      lease: ${ACCESS_TOKEN_REFRESH_LOCK_LEASE}
