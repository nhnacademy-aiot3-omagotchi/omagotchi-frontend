server:
  port: ${SERVER_PORT}
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE}
        same-site: lax

spring:
  application:
    name: frontend
  cloud:
    loadbalancer:
      cache:
        enabled: false
  http:
    clients:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT}
    serviceclient:
      identity-service:
        base-url: ${IDENTITY_SERVICE_BASE_URL}
      identity-account-service:
        base-url: ${IDENTITY_SERVICE_BASE_URL}
      learning-service:
        base-url: ${LEARNING_SERVICE_BASE_URL}
      learning-ai-service:
        # 읽기 타임아웃은 여기 두면 안 된다. Boot의 WebClientCustomizer 적용(order 0)이
        # 그룹 프로퍼티 적용(order MIN_VALUE) 뒤에 돌면서 전역 커넥터로 덮어쓴다.
        # AiChatHttpServiceConfig가 그 뒤 순서로 직접 건다 (clients.ai-chat.read-timeout)
        base-url: ${LEARNING_SERVICE_BASE_URL}
  data:
    redis:
      host: ${SESSION_REDIS_HOST}
      port: ${SESSION_REDIS_PORT}
      database: ${SESSION_REDIS_DATABASE}
      username: ${SESSION_REDIS_USERNAME}
      password: ${SESSION_REDIS_PASSWORD}
      connect-timeout: ${SESSION_REDIS_CONNECT_TIMEOUT}
      timeout: ${SESSION_REDIS_COMMAND_TIMEOUT}
      ssl:
        enabled: ${SESSION_REDIS_SSL_ENABLED}
  session:
    timeout: ${SESSION_TIMEOUT}
    data:
      redis:
        namespace: ${SESSION_REDIS_NAMESPACE}
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          no-cache: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

eureka:
  client:
    enabled: ${EUREKA_ENABLED}
    register-with-eureka: false
    fetch-registry: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

clients:
  identity:
    username: ${FRONTEND_USERNAME}
    password: ${FRONTEND_PASSWORD}
  ai-chat:
    # AI 채팅만 SSE라 첫 바이트까지 십수 초가 걸린다(모델 1차 호출 → Tool 실행 → 모델 2차 호출).
    # 그 동안 읽히는 바이트가 없어 전역 read-timeout(5s)으로는 응답이 시작되기 전에 끊긴다.
    # 상한은 nginx proxy_read_timeout(기본 60s)이므로 그보다 여유를 두고 잡는다
    read-timeout: ${AI_CHAT_READ_TIMEOUT:30s}

auth:
  access-token-refresh:
    refresh-before-expiry: ${ACCESS_TOKEN_REFRESH_BEFORE_EXPIRY}
    lock:
      wait-timeout: ${ACCESS_TOKEN_REFRESH_LOCK_WAIT_TIMEOUT}
      poll-interval: ${ACCESS_TOKEN_REFRESH_LOCK_POLL_INTERVAL}
      lease: ${ACCESS_TOKEN_REFRESH_LOCK_LEASE}
