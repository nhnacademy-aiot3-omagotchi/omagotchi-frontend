<section class="dashboard-panel" data-dashboard-panel="community" th:fragment="panel">
    <div class="panel-heading">
        <div><span>커뮤니티</span><h2>공지와 신고 관리</h2></div>
        <button type="button" data-open-notice-form>공지 작성</button>
    </div>
    <form class="notice-form" data-notice-form hidden>
        <input name="title" type="text" placeholder="공지 제목" />
        <textarea name="content" placeholder="공지 내용을 입력하세요"></textarea>
        <button type="submit">공지 등록</button>
        <button class="secondary-button" type="button" data-cancel-notice>취소</button>
    </form>
    <div class="community-list" data-community-list></div>
</section>
