<section class="dashboard-panel" data-dashboard-panel="studyStats" th:fragment="panel">
    <div class="panel-heading">
        <div><span>공부 통계</span><h2>수강생 공부 기록</h2></div>
        <label class="search-field">
            <span>검색</span>
            <input type="search" data-studystats-search placeholder="이름 또는 이메일" />
        </label>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>구성원</th>
                    <th>이메일</th>
                    <th>오늘 누적 학습</th>
                    <th>총 누적 학습</th>
                    <th>진행 세션 수</th>
                </tr>
            </thead>
            <tbody data-studystats-list></tbody>
        </table>
    </div>
    <p class="scope-note">통계 데이터는 백엔드 연동 시 실제 사용자의 타이머 기록을 집계하여 표시됩니다. 현재 화면은 프로토타입 데이터를 출력합니다.</p>
</section>
