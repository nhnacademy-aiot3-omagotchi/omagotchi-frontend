<section class="dashboard-panel" data-dashboard-panel="studyStats" th:fragment="panel">
    <div class="panel-heading study-statistics-heading">
        <div>
            <span>공부 통계</span>
            <h2>수강생 공부 기록</h2>
        </div>
        <div class="study-statistics-controls">
            <label class="date-field">
                <span>조회 기간</span>
                <select data-studystats-period>
                    <option value="7">최근 7일</option>
                    <option value="30">최근 30일</option>
                </select>
            </label>
        </div>
    </div>
    <p class="study-boundary-note">Asia/Seoul 오전 4시를 하루의 시작으로 집계합니다.</p>

    <div class="stats-kpi-grid" aria-label="오늘 공부 통계 요약">
        <article class="kpi-card">
            <span>오늘 기수 총 학습</span>
            <strong data-kpi-total-time>—</strong>
        </article>
        <article class="kpi-card">
            <span>오늘 참여</span>
            <strong data-kpi-participation>—</strong>
        </article>
        <article class="kpi-card">
            <span>참여자 평균 학습</span>
            <strong data-kpi-avg-time>—</strong>
        </article>
        <article class="kpi-card">
            <span>오늘 기록 없음</span>
            <strong data-kpi-no-record>—</strong>
        </article>
    </div>
    <div class="study-resource-status" data-study-status="today" role="status" aria-live="polite" hidden>
        <span data-study-status-message></span>
        <button type="button" class="secondary-button" data-study-retry="today">다시 시도</button>
    </div>

    <div class="stats-chart-grid">
        <section class="chart-card wide-chart" aria-labelledby="trend-chart-title">
            <h3 id="trend-chart-title" data-trend-chart-title>최근 7일 기수 학습량 추이</h3>
            <div class="study-resource-status" data-study-status="trend" role="status" aria-live="polite" hidden>
                <span data-study-status-message></span>
                <button type="button" class="secondary-button" data-study-retry="trend">다시 시도</button>
            </div>
            <div class="chart-container">
                <canvas id="trendChart" aria-label="날짜별 기수 학습량 차트">날짜별 기수 학습량을 표시합니다.</canvas>
            </div>
        </section>
        <section class="chart-card" aria-labelledby="top-chart-title">
            <h3 id="top-chart-title" data-top-chart-title>최근 7일 학습량 Top 5</h3>
            <div class="study-resource-status" data-study-status="top" role="status" aria-live="polite" hidden>
                <span data-study-status-message></span>
                <button type="button" class="secondary-button" data-study-retry="top">다시 시도</button>
            </div>
            <div class="chart-container">
                <canvas id="topStudentsChart" aria-label="수강생 학습량 상위 5명 차트">수강생 학습량 상위 5명을 표시합니다.</canvas>
            </div>
        </section>
        <section class="chart-card" aria-labelledby="duration-chart-title">
            <h3 id="duration-chart-title">오늘 학습 시간 분포</h3>
            <div class="chart-container">
                <canvas id="durationDistributionChart" aria-label="오늘 학습 시간 구간별 수강생 분포 차트">오늘 학습 시간 분포를 표시합니다.</canvas>
            </div>
        </section>
    </div>

    <div class="study-resource-status" data-study-status="members" role="status" aria-live="polite" hidden>
        <span data-study-status-message></span>
        <button type="button" class="secondary-button" data-study-retry="members">다시 시도</button>
    </div>
    <div class="table-wrap">
        <table>
            <caption class="visually-hidden">수강생별 오늘 및 조회 기간 공부 통계</caption>
            <colgroup>
                <col style="width: 18%;" />
                <col style="width: 13%;" />
                <col style="width: 13%;" />
                <col style="width: 10%;" />
                <col style="width: 10%;" />
                <col style="width: 22%;" />
                <col style="width: 14%;" />
            </colgroup>
            <thead>
                <tr>
                    <th class="sortable" data-sort-heading="cohortMembershipId" aria-sort="none" scope="col">
                        <button type="button" data-study-sort="cohortMembershipId">수강생 <span aria-hidden="true">↕</span></button>
                    </th>
                    <th class="sortable" data-sort-heading="todayStudySeconds" aria-sort="none" scope="col">
                        <button type="button" data-study-sort="todayStudySeconds">오늘 학습 <span aria-hidden="true">↕</span></button>
                    </th>
                    <th class="sortable" data-sort-heading="periodStudySeconds" aria-sort="descending" scope="col">
                        <button type="button" data-study-sort="periodStudySeconds">조회 기간 <span aria-hidden="true">↓</span></button>
                    </th>
                    <th class="sortable" data-sort-heading="activeStudyDays" aria-sort="none" scope="col">
                        <button type="button" data-study-sort="activeStudyDays">학습일 <span aria-hidden="true">↕</span></button>
                    </th>
                    <th class="sortable" data-sort-heading="recordCount" aria-sort="none" scope="col">
                        <button type="button" data-study-sort="recordCount">세션 <span aria-hidden="true">↕</span></button>
                    </th>
                    <th class="sortable" data-sort-heading="lastStudiedAt" aria-sort="none" scope="col">
                        <button type="button" data-study-sort="lastStudiedAt">최근 기록 <span aria-hidden="true">↕</span></button>
                    </th>
                    <th scope="col">기록 확인</th>
                </tr>
            </thead>
            <tbody data-studystats-list>
                <tr><td class="empty-row" colspan="7">공부 통계를 불러오는 중입니다.</td></tr>
            </tbody>
        </table>
    </div>

    <nav class="pagination-wrap" aria-label="수강생 공부 통계 페이지">
        <div class="page-numbers" data-page-numbers></div>
    </nav>
    <template data-studystats-row-template>
        <tr>
            <td>
                <button type="button" class="study-member-link" data-view-detail>
                    <strong data-studystats-member-label></strong>
                </button>
            </td>
            <td data-studystats-today></td>
            <td data-studystats-period-total></td>
            <td data-studystats-active-days></td>
            <td data-studystats-record-count></td>
            <td data-studystats-last-studied></td>
            <td>
                <div class="table-actions">
                    <button type="button" class="secondary-button" data-view-detail>상세 보기</button>
                </div>
            </td>
        </tr>
    </template>
    <template data-studystats-empty-template>
        <tr><td class="empty-row" colspan="7" data-studystats-empty-message></td></tr>
    </template>
    <template data-studystats-page-template>
        <button type="button" class="page-btn" data-go-page></button>
    </template>
</section>
