<section class="dashboard-panel" data-dashboard-panel="studyStats" th:fragment="panel">
    <div class="panel-heading study-statistics-heading">
        <div>
            <span>공부 통계</span>
            <h2>수강생 공부 기록</h2>
        </div>
        <div class="study-statistics-controls">
            <label class="date-field">
                <span>조회 기간</span>
                <select data-studystats-period>
                    <option value="7">최근 7일</option>
                    <option value="30">최근 30일</option>
                </select>
            </label>
            <label class="search-field">
                <span>검색</span>
                <input type="search" data-studystats-search placeholder="이름 또는 이메일" />
            </label>
        </div>
    </div>
    <p class="study-boundary-note" data-study-boundary-note>Asia/Seoul 오전 4시를 하루의 시작으로 집계합니다.</p>

    <div class="stats-kpi-grid" aria-label="공부 통계 요약">
        <article class="kpi-card">
            <span>오늘 기수 총 학습</span>
            <strong data-kpi-total-time>0분</strong>
        </article>
        <article class="kpi-card">
            <span>오늘 참여</span>
            <strong data-kpi-participation>0 / 0명</strong>
        </article>
        <article class="kpi-card">
            <span>참여자 평균 학습</span>
            <strong data-kpi-avg-time>0분</strong>
        </article>
        <article class="kpi-card">
            <span>오늘 기록 없음</span>
            <strong data-kpi-no-record>0명</strong>
        </article>
    </div>

    <div class="stats-chart-grid">
        <div class="chart-card wide-chart">
            <h3 data-trend-chart-title>최근 7일 기수 학습량 추이</h3>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3 data-top-chart-title>최근 7일 학습량 Top 5</h3>
            <div class="chart-container">
                <canvas id="topStudentsChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>오늘 학습 시간 분포</h3>
            <div class="chart-container">
                <canvas id="durationDistributionChart"></canvas>
            </div>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <colgroup>
                <col style="width: 14%;" />
                <col style="width: 23%;" />
                <col style="width: 14%;" />
                <col style="width: 14%;" />
                <col style="width: 10%;" />
                <col style="width: 15%;" />
                <col style="width: 10%;" />
            </colgroup>
            <thead>
                <tr>
                    <th class="sortable" data-sort="name">구성원</th>
                    <th>이메일</th>
                    <th class="sortable" data-sort="today">오늘 학습</th>
                    <th class="sortable" data-sort="period">조회 기간</th>
                    <th class="sortable" data-sort="days">학습일</th>
                    <th class="sortable" data-sort="last">최근 기록</th>
                    <th>기록 확인</th>
                </tr>
            </thead>
            <tbody data-studystats-list>
                <tr><td class="empty-row" colspan="7">공부 통계를 불러오는 중입니다.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-wrap">
        <div class="page-numbers" data-page-numbers aria-label="공부 통계 페이지"></div>
    </div>
</section>
