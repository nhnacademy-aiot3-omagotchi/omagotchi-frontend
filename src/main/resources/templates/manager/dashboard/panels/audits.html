<section class="dashboard-panel" data-dashboard-panel="audits" th:fragment="panel">
    <div class="panel-heading">
        <div><span>작업 이력</span><h2>기수 감사 로그</h2></div>
        <span class="count-badge">현재 기수</span>
    </div>
    <div class="table-wrap">
        <table>
            <colgroup>
                <col style="width: 20%;" />
                <col style="width: 20%;" />
                <col style="width: 20%;" />
                <col style="width: 40%;" />
            </colgroup>
            <thead><tr><th>시각</th><th>작업</th><th>대상</th><th>내용</th></tr></thead>
            <tbody data-audit-list></tbody>
        </table>
    </div>
    <template data-audit-row-template>
        <tr>
            <td data-audit-occurred-at></td>
            <td data-audit-action></td>
            <td data-audit-target></td>
            <td data-audit-detail></td>
        </tr>
    </template>
    <template data-audit-empty-template>
        <tr><td class="empty-row" colspan="4">기록된 작업 이력이 없습니다.</td></tr>
    </template>
</section>
