<section class="dashboard-panel" data-dashboard-panel="members" th:fragment="panel">
    <div class="panel-heading">
        <div><span>소속 관리</span><h2>기수 구성원</h2></div>
        <label class="search-field"><span>검색</span><input type="search" data-member-search placeholder="이름 또는 이메일" /></label>
    </div>
<!-- Scope note: 실 운영 환경에서는 삭제 해야 함 -->
    <p class="scope-note">현재 Learning API는 사용자 이름·이메일과 소속 상태 변경 계약을 제공하지 않아 식별자를 마스킹해 표시합니다.</p>
    <div class="table-wrap">
        <table>
            <colgroup>
                <col style="width: 15%;" />
                <col style="width: 35%;" />
                <col style="width: 15%;" />
                <col style="width: 15%;" />
                <col style="width: 20%;" />
            </colgroup>
            <thead><tr><th>구성원</th><th>이메일</th><th>기수 역할</th><th>소속 상태</th><th>관리</th></tr></thead>
            <tbody data-member-list></tbody>
        </table>
    </div>
    <template data-member-row-template>
        <tr>
            <td><strong data-member-name></strong></td>
            <td data-member-email></td>
            <td data-member-role></td>
            <td><span class="status-badge" data-member-status-label></span></td>
            <td>
                <div class="table-actions">
                    <small data-member-manager-note hidden>시스템 관리자만 변경 가능</small>
                    <button type="button" data-member-status hidden></button>
                    <button class="is-danger" type="button" data-member-end hidden>소속 종료</button>
                </div>
            </td>
        </tr>
    </template>
</section>
