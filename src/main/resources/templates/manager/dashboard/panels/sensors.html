<section class="dashboard-panel" data-dashboard-panel="sensors" th:fragment="panel">
    <div class="panel-heading">
        <div><span>공간·센서</span><h2>실습실 환경</h2></div>
        <div class="panel-heading-actions">
            <span class="updated-at" data-sensor-updated>마지막 수신 -</span>
            <button class="secondary-button" type="button" data-open-sensor-thresholds>임계치 설정</button>
        </div>
    </div>
    <div class="sensor-grid">
        <article><span>온도</span><strong data-sensor-temperature>--</strong><small data-sensor-temperature-range>권장 20~26℃</small></article>
        <article><span>습도</span><strong data-sensor-humidity>--</strong><small data-sensor-humidity-range>권장 40~60%</small></article>
        <article><span>이산화탄소</span><strong data-sensor-co2>--</strong><small data-sensor-co2-state>수신 대기</small></article>
        <article><span>현재 재실</span><strong data-sensor-occupancy>--</strong><small data-sensor-occupancy-range>입실 기준</small></article>
    </div>
    <form class="sensor-threshold-form" data-sensor-threshold-form hidden>
        <div class="sensor-threshold-fields">
            <label><span>최저 온도</span><input name="temperatureMin" type="number" step="0.1" /></label>
            <label><span>최고 온도</span><input name="temperatureMax" type="number" step="0.1" /></label>
            <label><span>최저 습도</span><input name="humidityMin" type="number" step="1" /></label>
            <label><span>최고 습도</span><input name="humidityMax" type="number" step="1" /></label>
            <label><span>CO₂ 경고</span><input name="co2Max" type="number" step="1" /></label>
            <label><span>최대 재실</span><input name="occupancyMax" type="number" step="1" min="1" /></label>
        </div>
        <div class="sensor-threshold-actions">
            <button type="submit">저장</button>
            <button class="secondary-button" type="button" data-cancel-sensor-thresholds>취소</button>
        </div>
    </form>
    <div class="sensor-notice" data-sensor-notice>센서 데이터는 이 기수의 실습실에 한해 표시됩니다.</div>
</section>
