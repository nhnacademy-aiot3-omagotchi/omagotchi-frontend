<section class="dashboard-panel" data-dashboard-panel="attendance" th:fragment="panel">
    <div class="panel-heading">
        <div><span>출결 관리</span><h2>오늘의 출결</h2></div>
        <label class="date-field"><span>조회일</span><input type="date" data-attendance-date /></label>
    </div>
    <div class="table-wrap">
        <table>
            <colgroup>
                <col style="width: 15%;" />
                <col style="width: 20%;" />
                <col style="width: 20%;" />
                <col style="width: 15%;" />
                <col style="width: 15%;" />
                <col style="width: 15%;" />
            </colgroup>
            <thead><tr><th>구성원</th><th>입실</th><th>퇴실</th><th>자동 판정</th><th>최종 상태</th><th>관리</th></tr></thead>
            <tbody data-attendance-list></tbody>
        </table>
    </div>
    <template data-attendance-row-template>
        <tr>
            <td><strong data-attendance-member-name></strong><small data-attendance-member-email></small></td>
            <td data-attendance-check-in></td>
            <td data-attendance-check-out></td>
            <td data-attendance-auto-status></td>
            <td><span class="status-badge" data-attendance-final-status></span></td>
            <td><div class="table-actions"><button type="button" data-attendance-edit>상태 변경</button></div></td>
        </tr>
    </template>
    <template data-attendance-empty-template>
        <tr><td class="empty-row" colspan="6">조회할 구성원이 없습니다.</td></tr>
    </template>
</section>
