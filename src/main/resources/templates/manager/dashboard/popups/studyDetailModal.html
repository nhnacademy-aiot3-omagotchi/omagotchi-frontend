<th:block th:fragment="modal">
    <div class="manager-dialog-backdrop" data-study-detail-dialog hidden>
        <section class="manager-dialog study-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="study-detail-title">
            <header class="study-detail-header">
                <div>
                    <span class="study-detail-eyebrow">개인 공부 통계</span>
                    <h2 id="study-detail-title"><span data-detail-name>수강생</span> 님의 공부 기록</h2>
                    <p class="study-detail-email" data-detail-email></p>
                </div>
                <button type="button" class="study-detail-close" data-detail-close aria-label="상세 보기 닫기">×</button>
            </header>

            <section class="study-detail-toolbar" aria-label="개인 통계 조회 조건">
                <div class="study-detail-period-tabs" role="group" aria-label="조회 기간">
                    <button type="button" data-detail-period-days="7" aria-pressed="true">최근 7일</button>
                    <button type="button" data-detail-period-days="30" aria-pressed="false">최근 30일</button>
                </div>
                <p data-detail-period>최근 7일의 학습 기록입니다.</p>
            </section>

            <p class="study-detail-status" data-detail-status role="status" aria-live="polite"></p>

            <section class="study-detail-kpi-grid" aria-label="개인 공부 통계 요약">
                <article>
                    <span>기간 총 학습</span>
                    <strong data-detail-total>0분</strong>
                </article>
                <article>
                    <span>학습일 평균</span>
                    <strong data-detail-average>0분</strong>
                </article>
                <article>
                    <span>학습한 날</span>
                    <strong data-detail-active-days>0일</strong>
                </article>
                <article>
                    <span>공부 세션</span>
                    <strong data-detail-record-count>0회</strong>
                </article>
            </section>

            <section class="chart-card study-detail-chart-card" aria-labelledby="study-detail-chart-title">
                <div class="study-detail-section-heading">
                    <div>
                        <span>날짜별 통계</span>
                        <h3 id="study-detail-chart-title">개인 학습량 추이</h3>
                    </div>
                    <small>막대를 선택하면 해당 날짜의 기록을 확인할 수 있습니다.</small>
                </div>
                <div class="study-detail-chart-container">
                    <canvas id="memberStudyTrendChart" data-detail-trend-chart></canvas>
                    <p class="study-detail-chart-empty" data-detail-chart-empty hidden>표시할 학습 기록이 없습니다.</p>
                </div>
            </section>

            <section class="study-detail-day-card" aria-labelledby="study-detail-day-title">
                <header class="study-detail-day-header">
                    <div>
                        <span>선택 날짜 타임라인</span>
                        <h3 id="study-detail-day-title" data-detail-selected-date-label>날짜를 선택해 주세요.</h3>
                    </div>
                    <div class="study-detail-date-controls">
                        <button type="button" class="secondary-button" data-detail-previous-date aria-label="이전 날짜">‹</button>
                        <label>
                            <span class="visually-hidden">확인할 날짜</span>
                            <input type="date" data-detail-date />
                        </label>
                        <button type="button" class="secondary-button" data-detail-next-date aria-label="다음 날짜">›</button>
                        <button type="button" class="secondary-button" data-detail-today>오늘</button>
                    </div>
                </header>

                <p class="study-detail-boundary-note">오전 4시부터 다음 날 오전 4시까지를 하루로 표시합니다.</p>

                <div class="study-timeline" data-detail-timeline aria-label="선택 날짜의 24시간 공부 타임라인">
                    <div class="study-timeline-axis" aria-hidden="true">
                        <span style="left: 0">04</span>
                        <span style="left: 12.5%">07</span>
                        <span style="left: 25%">10</span>
                        <span style="left: 37.5%">13</span>
                        <span style="left: 50%">16</span>
                        <span style="left: 62.5%">19</span>
                        <span style="left: 75%">22</span>
                        <span style="left: 87.5%">01</span>
                        <span style="left: 100%">04</span>
                    </div>
                    <div class="study-timeline-track" data-detail-timeline-track></div>
                    <p class="study-timeline-empty" data-detail-timeline-empty hidden>이 날짜에는 공부 기록이 없습니다.</p>
                </div>

                <div class="study-detail-record-heading">
                    <h4>공부 상세 시간</h4>
                    <span data-detail-selected-count>0개 세션</span>
                </div>
                <div class="study-detail-record-list" data-study-detail-list>
                    <p class="study-detail-empty">날짜별 기록을 불러오는 중입니다.</p>
                </div>
            </section>

            <template data-detail-timeline-bar-template>
                <button type="button" class="study-timeline-bar" data-timeline-record>
                    <span data-detail-timeline-duration></span>
                </button>
            </template>
            <template data-detail-record-template>
                <article class="study-detail-record" data-detail-record-id>
                    <span class="study-detail-record-index" data-detail-record-index></span>
                    <div>
                        <strong data-detail-record-range></strong>
                        <small>실제 공부 구간</small>
                    </div>
                    <div>
                        <strong data-detail-record-duration></strong>
                        <small>인정 학습 시간</small>
                    </div>
                    <div>
                        <strong data-detail-record-updated-at></strong>
                        <small>최종 수정</small>
                    </div>
                </article>
            </template>
            <template data-detail-record-empty-template>
                <p class="study-detail-empty">선택한 날짜에는 공부 기록이 없습니다.</p>
            </template>

            <footer class="study-detail-footer">
                <button type="button" data-detail-close>닫기</button>
            </footer>
        </section>
    </div>
</th:block>
