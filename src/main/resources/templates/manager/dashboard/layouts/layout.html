<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi 기수 운영</title>
    <link rel="icon" type="image/gif" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/managerDashboard.css"
          th:href="@{/css/managerDashboard.css}" />
    <link rel="stylesheet" href="/css/serviceIntegrationState.css"
          th:href="@{/css/serviceIntegrationState.css}" />
    <link rel="stylesheet" href="/css/imageProtection.css"
          th:href="@{/css/imageProtection.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="manager-page">
    <header class="manager-header">
        <a class="manager-brand" href="/manager-dashboard" th:href="@{/manager-dashboard}">
            Omagotchi <span>기수 운영</span>
        </a>
        <div class="manager-account">
            <span class="role-badge">기수 관리자</span>
            <div>
                <strong data-manager-name>관리자</strong>
                <small data-manager-email></small>
            </div>
            <form action="/logout" th:action="@{/logout}" method="post" data-manager-logout-form>
                <button type="submit">로그아웃</button>
            </form>
        </div>
    </header>

    <div class="manager-layout">
        <aside class="manager-sidebar">
            <section class="scope-card">
                <span>현재 관리 기수</span>
                <select data-cohort-select aria-label="관리할 기수 선택"></select>
                <small>배정받은 기수만 표시됩니다.</small>
            </section>
            <nav aria-label="기수 관리자 메뉴" data-dashboard-navigation></nav>
        </aside>

        <div class="manager-content" layout:fragment="content"></div>
    </div>
</main>

<div class="manager-dialog-backdrop" data-dialog-backdrop hidden>
    <section class="manager-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title" data-dialog-title>확인</h2>
        <p data-dialog-message></p>
        <!-- 정해진 값 중 하나를 고르는 입력. 자유 입력으로 두면 사용자가 enum을 타이핑해야 한다. -->
        <!-- 선택이 먼저다. 자유 입력(사유)은 선택에 딸린 보조 입력이므로 아래에 둔다. -->
        <label data-dialog-select-wrap hidden>
            <span data-dialog-select-label>선택</span>
            <select data-dialog-select></select>
        </label>
        <label data-dialog-input-wrap hidden>
            <span data-dialog-input-label>사유</span>
            <input data-dialog-input />
        </label>
        <p class="dialog-error" data-dialog-error role="alert" hidden></p>
        <div>
            <button type="button" data-dialog-confirm>확인</button>
            <button class="secondary-button" type="button" data-dialog-cancel>취소</button>
        </div>
    </section>
</div>

<th:block layout:fragment="pageScripts"></th:block>
<script src="/js/imageProtection.js" th:src="@{/js/imageProtection.js}"></script>
</body>
</html>
