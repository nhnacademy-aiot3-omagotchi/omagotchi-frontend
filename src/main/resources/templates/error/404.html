<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이지를 찾을 수 없음 - Omagotchi</title>

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="stylesheet" href="/css/error.css" />
</head>
<body>
<main class="error-page">
    <section class="error-content" aria-labelledby="error-title">
        <p class="error-code">404</p>

        <div class="error-character-stage">
            <p class="error-bubble">길을 잘못 든 것 같아요.</p>
            <img src="/images/characters/default/omagotchi.png"
                 alt="길을 찾고 있는 오마고치" />
        </div>

        <div class="error-message">
            <h1 id="error-title">페이지를 찾을 수 없습니다</h1>
            <p>주소가 변경되었거나 존재하지 않는 화면입니다.</p>
        </div>

        <nav class="error-actions" aria-label="오류 화면 이동">
            <button type="button" data-error-back>이전 화면</button>
            <a href="/">처음 화면</a>
        </nav>
    </section>
</main>

<script src="/js/error.js"></script>
</body>
</html>
