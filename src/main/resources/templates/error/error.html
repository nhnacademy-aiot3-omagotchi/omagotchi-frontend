<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오류가 발생했습니다 - Omagotchi</title>

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" th:href="@{/favicon.png}" />
    <link rel="stylesheet" href="/css/error.css" th:href="@{/css/error.css}" />
    <link rel="stylesheet" href="/css/imageProtection.css" th:href="@{/css/imageProtection.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="error-page">
    <section class="error-content" aria-labelledby="error-title">
        <p class="error-code" th:text="${status != null ? status : 'ERROR'}">ERROR</p>

        <div class="error-character-stage">
            <p class="error-bubble">화면을 불러오지 못했어요.</p>
            <img src="/images/characters/default/omagotchi.png"
                 alt="오류를 확인하고 있는 오마고치" />
        </div>

        <div class="error-message">
            <h1 id="error-title">예상하지 못한 문제가 발생했습니다</h1>
            <p>이전 화면으로 돌아가거나 처음부터 다시 시작해 주세요.</p>
        </div>

        <nav class="error-actions" aria-label="오류 화면 이동">
            <button type="button" data-error-back>이전 화면</button>
            <a href="/">처음 화면</a>
        </nav>
    </section>
</main>

<script src="/js/error.js" th:src="@{/js/error.js}"></script>
<script src="/js/imageProtection.js" th:src="@{/js/imageProtection.js}"></script>
</body>
</html>
