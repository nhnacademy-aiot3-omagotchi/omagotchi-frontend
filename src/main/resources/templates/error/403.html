<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>접근할 수 없는 화면 - Omagotchi</title>

    <link rel="icon" type="image/gif" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/error.css" th:href="@{/css/error.css}" />
    <link rel="stylesheet" href="/css/imageProtection.css" th:href="@{/css/imageProtection.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="error-page">
    <section class="error-content" aria-labelledby="error-title">
        <p class="error-code">403</p>

        <div class="error-character-stage">
            <p class="error-bubble">이 공간에는 들어갈 수 없어요.</p>
            <img src="/images/characters/default/omagotchi.png"
                 alt="출입 권한을 확인하는 오마고치" />
        </div>

        <div class="error-message">
            <h1 id="error-title"
                th:text="${errorTitle != null ? errorTitle : '접근 권한이 없습니다'}">접근 권한이 없습니다</h1>
            <p th:text="${errorDescription != null ? errorDescription : '로그인 상태와 소속 기수 권한을 확인해 주세요.'}">
                로그인 상태와 소속 기수 권한을 확인해 주세요.
            </p>
        </div>

        <nav class="error-actions" aria-label="오류 화면 이동">
            <button type="button" data-error-back>이전 화면</button>
            <a href="/">처음 화면</a>
        </nav>
    </section>
</main>

<script src="/js/error.js" th:src="@{/js/error.js}"></script>
<script src="/js/imageProtection.js" th:src="@{/js/imageProtection.js}"></script>
</body>
</html>
