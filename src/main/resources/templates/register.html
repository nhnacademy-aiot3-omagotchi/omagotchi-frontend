<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi 회원가입</title>

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" th:href="@{/favicon.png}" />
    <link rel="stylesheet" href="/css/auth.css" th:href="@{/css/auth.css}" />
    <link rel="stylesheet" href="/css/passwordToggle.css" th:href="@{/css/passwordToggle.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="login-page auth-page">
    <section class="login-card auth-card" aria-labelledby="register-title">
        <header class="auth-card-header">
            <a class="auth-back-link" href="/" aria-label="인덱스로 돌아가기">←</a>
            <p class="auth-brand">omagotchi</p>
        </header>

        <form class="auth-form register-form auth-panel" action="#" method="post">
            <h1 id="register-title">계정을 생성하세요</h1>
            <p class="auth-subtitle" data-auth-feedback>오마고치와 함께하는 학습</p>

            <div class="auth-segmented" aria-label="인증 메뉴">
                <a href="/login">로그인</a>
                <span class="is-active">회원가입</span>
            </div>

            <label class="input-group auth-input-group">
                <span class="sr-only">이메일</span>
                <input type="email" name="email" placeholder="이메일" autocomplete="username" />
            </label>

            <div class="input-group auth-input-group">
                <label class="sr-only" for="register-password">비밀번호</label>
                <div class="password-input-wrap">
                    <input id="register-password" type="password" name="password" placeholder="비밀번호" autocomplete="new-password" />
                    <button class="password-visibility-toggle" type="button" data-password-toggle
                            aria-label="비밀번호 표시" aria-pressed="false">
                        <span class="password-eye" aria-hidden="true"></span>
                    </button>
                </div>
            </div>

            <button class="auth-button register-button auth-submit-button" type="submit">
                계정 생성하기
            </button>
        </form>
    </section>
</main>

<script src="/js/api.js" th:src="@{/js/api.js}"></script>
<script src="/js/register.js" th:src="@{/js/register.js}"></script>
<script src="/js/passwordToggle.js" th:src="@{/js/passwordToggle.js}"></script>
<script src="/js/scrollCue.js" th:src="@{/js/scrollCue.js}"></script>
</body>
</html>
