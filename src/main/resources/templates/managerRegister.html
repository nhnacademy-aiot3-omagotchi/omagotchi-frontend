<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi 기수 관리자 계정 등록</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" th:href="@{/favicon.png}" />
    <link rel="stylesheet" href="/css/managerAuth.css" th:href="@{/css/managerAuth.css}" />
    <link rel="stylesheet" href="/css/passwordToggle.css" th:href="@{/css/passwordToggle.css}" />
    <link rel="stylesheet" href="/css/imageProtection.css" th:href="@{/css/imageProtection.css}" />
</head>
<body>
<main class="manager-auth-page">
    <a class="manager-auth-back" href="/manager-login">← 관리자 로그인</a>
    <section class="manager-auth-shell is-register login-card">
        <div class="manager-auth-character">
            <div class="speech-bubble">계정 등록 뒤에는<br />기수 배정이 필요해요.</div>
            <img class="manager-character-img" src="/images/manager_character.gif" alt="기수 관리자 오마고치" />
            <div>
                <span>ACCOUNT REGISTRATION</span>
                <h1>운영 계정을 등록합니다</h1>
                <p>계정 생성과 관리자 권한 부여는 별개입니다. 시스템 관리자가 기수의 관리자 소속을 배정해야 운영 화면을 사용할 수 있습니다.</p>
            </div>
        </div>
        <div class="manager-auth-form-panel">
            <form class="manager-register-form" action="#" method="post">
                <span class="form-kicker">계정 정보</span>
                <h2>관리자 계정 등록</h2>
                <p>담당 기수는 여기서 선택하지 않습니다.<br /> 권한과 기수 배정은 시스템 관리자가 처리합니다.</p>
                <div class="manager-register-grid">
                    <label class="input-group"><span>이름</span><input type="text" name="username" placeholder="이름을 입력하세요" autocomplete="name" /></label>
                    <label class="input-group"><span>소속 기관</span><input type="text" name="organ" placeholder="예: NHN Academy" autocomplete="organization" /></label>
                </div>
                <label class="input-group"><span>이메일</span><input type="email" name="email" placeholder="manager@example.com" autocomplete="username" /></label>
                <div class="input-group">
                    <label for="manager-register-password">비밀번호</label>
                    <div class="password-input-wrap">
                        <input id="manager-register-password" type="password" name="password" placeholder="8자리 이상 입력하세요" autocomplete="new-password" />
                        <button class="password-visibility-toggle" type="button" data-password-toggle
                                aria-label="비밀번호 표시" aria-pressed="false">
                            <span class="password-eye" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
                <button class="manager-auth-submit" type="submit">계정 등록</button>
                <div class="manager-auth-links"><span>이미 계정이 있다면 <a href="/manager-login">로그인</a></span></div>
            </form>
        </div>
    </section>
</main>
<script src="/js/managerRegister.js" th:src="@{/js/managerRegister.js}"></script>
<script src="/js/passwordToggle.js" th:src="@{/js/passwordToggle.js}"></script>
<script src="/js/imageProtection.js" th:src="@{/js/imageProtection.js}"></script>
</body>
</html>
