<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi System Admin</title>
    <link rel="icon" type="image/gif" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/managerDashboard.css" th:href="@{/css/managerDashboard.css}" />
    <link rel="stylesheet" href="/css/systemAdminDashboard.css" th:href="@{/css/systemAdminDashboard.css}" />
    <link rel="stylesheet" href="/css/serviceIntegrationState.css" th:href="@{/css/serviceIntegrationState.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="manager-page system-admin-page">
    <header class="manager-header system-admin-header">
        <a class="manager-brand system-admin-brand" href="/system-admin-dashboard" th:href="@{/system-admin-dashboard}">
            <span><strong>Omagotchi</strong><small>시스템 관리</small></span>
        </a>
        <div class="manager-account">
            <span class="role-badge system-role-badge">SYSTEM_ADMIN</span>
            <div><strong>시스템 관리자</strong><small data-system-admin-name></small></div>
            <form action="/logout" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit">로그아웃</button>
            </form>
        </div>
    </header>

    <div class="manager-layout system-admin-layout">
        <aside class="manager-sidebar system-admin-sidebar">
            <section class="scope-card system-scope-card">
                <span>관리 범위</span>
                <strong>Omagotchi 전체 시스템</strong>
                <small>모든 사용자 및 기수</small>
            </section>
            <nav aria-label="시스템 관리자 메뉴" data-system-admin-navigation>
                <button class="is-active" type="button" data-panel-target="system-overview">전체 현황</button>
                <button type="button" data-panel-target="system-users">사용자 관리</button>
                <button type="button" data-panel-target="system-cohorts">기수 관리</button>
                <button type="button" data-panel-target="system-audits">감사 로그</button>
            </nav>
            <section class="system-sidebar-note">
                <strong>System Console</strong>
                <p>권한과 기수 변경 내역은 감사 로그에 자동으로 기록됩니다.</p>
            </section>
        </aside>

        <div class="manager-content system-admin-content" layout:fragment="content"></div>
    </div>
</main>

<div class="system-toast" data-system-toast role="status" aria-live="polite"></div>
<th:block layout:fragment="pageDialogs"></th:block>
<th:block layout:fragment="pageScripts"></th:block>
</body>
</html>
