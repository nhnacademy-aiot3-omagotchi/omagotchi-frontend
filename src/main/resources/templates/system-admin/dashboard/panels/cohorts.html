<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="dashboard-panel system-panel" id="system-cohorts" th:fragment="panel">
    <header class="system-page-heading"><div><span>COHORT DIRECTORY</span><h1>전체 기수 관리</h1><p>교육 기수를 생성하고 운영 기간, 상태와 담당 관리자를 관리합니다.</p></div><button class="system-primary-button" type="button" data-open-cohort-dialog>＋ 새 기수 생성</button></header>
    <div class="system-contract-note"><small>기수 관리자가 최소 1명 필요합니다.</small></div>
    <div class="system-cohort-toolbar">
        <label class="system-search"><span class="sr-only">기수 검색</span><i aria-hidden="true">⌕</i><input type="search" placeholder="기수명, 설명, 담당자 검색" data-cohort-search /></label>
        <strong data-cohort-result-count>0개</strong>
    </div>
    <section class="system-cohort-grid" data-cohort-grid aria-label="전체 기수 목록"></section>
    <p class="system-empty" data-cohort-empty hidden>등록된 기수가 없습니다.</p>
</section>
</body>
</html>
