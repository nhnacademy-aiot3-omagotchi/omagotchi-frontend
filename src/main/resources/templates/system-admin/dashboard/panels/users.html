<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="dashboard-panel system-panel" id="system-users" th:fragment="panel">
    <header class="system-page-heading"><div><span>IDENTITY &amp; ACCESS</span><h1>사용자 및 권한 관리</h1><p>Omagotchi 사용자의 전역 권한과 기수별 운영 권한을 관리합니다.</p></div></header>
    <article class="system-card system-table-card">
        <div class="system-toolbar">
            <label class="system-search"><span class="sr-only">사용자 검색</span><i aria-hidden="true">⌕</i><input type="search" placeholder="이름 또는 이메일 검색" data-user-search /></label>
            <label class="system-filter"><span>계정 상태</span><select data-account-status-filter><option value="all">전체 상태</option><option value="ACTIVE">ACTIVE</option><option value="DISABLED">DISABLED</option><option value="WITHDRAWN">WITHDRAWN</option></select></label>
            <label class="system-filter"><span>로그인 잠금</span><select data-login-lock-filter><option value="all">전체</option><option value="true">잠금</option><option value="false">잠금 아님</option></select></label>
            <label class="system-filter"><span>권한</span><select data-role-filter><option value="all">전체 권한</option><option value="system">SYSTEM_ADMIN</option><option value="manager">COHORT_MANAGER</option><option value="user">일반 사용자</option></select></label>
            <strong data-user-result-count>0명</strong>
        </div>
        <div class="table-wrap">
            <table class="system-user-table">
                <caption class="sr-only">Omagotchi 사용자 권한 목록</caption>
                <thead><tr><th>사용자</th><th>계정 상태</th><th>전역 권한</th><th>기수 운영 권한</th><th>가입일</th><th><span class="sr-only">관리</span></th></tr></thead>
                <tbody data-user-table-body></tbody>
            </table>
        </div>
        <p class="system-empty" data-user-empty hidden>조건에 맞는 사용자가 없습니다.</p>
        <footer class="system-table-footer" data-user-pagination-footer>
            <span data-user-page-range>0명</span>
            <nav class="system-pagination" data-user-pagination aria-label="사용자 목록 페이지"></nav>
        </footer>
    </article>
</section>
</body>
</html>
