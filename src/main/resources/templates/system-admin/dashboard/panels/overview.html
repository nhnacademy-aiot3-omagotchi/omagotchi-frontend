<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="dashboard-panel is-active system-panel" id="system-overview" th:fragment="panel">
    <header class="system-page-heading"><div><span>SYSTEM OVERVIEW</span><h1>Omagotchi 전체 운영 현황</h1><p>사용자 권한과 전체 기수 운영 상태를 한곳에서 확인합니다.</p></div></header>
    <section class="summary-grid system-summary-grid" aria-label="시스템 운영 요약">
        <article><span>전체 사용자</span><strong data-summary-users>--</strong><small>Omagotchi 가입 계정</small></article>
        <article><span>시스템 관리자</span><strong data-summary-admins>--</strong><small>전체 시스템 권한 보유</small></article>
        <article><span>기수 관리자</span><strong data-summary-managers>--</strong><small>한 개 이상 기수 운영</small></article>
        <article><span>운영 중인 기수</span><strong data-summary-cohorts>--</strong><small data-summary-cohort-detail>전체 기수 확인 중</small></article>
    </section>
    <div class="system-overview-grid">
        <article class="system-card"><header><div><span>PRIVILEGED USERS</span><h2>관리 권한 보유자</h2></div><button type="button" data-go-panel="system-users">전체 사용자 보기 →</button></header><ul class="system-privileged-list" data-privileged-user-list></ul></article>
        <article class="system-card"><header><div><span>RECENT ACTIVITY</span><h2>최근 감사 로그</h2></div><button type="button" data-go-panel="system-audits">전체 로그 보기 →</button></header><ol class="system-recent-audits" data-recent-audit-list></ol></article>
    </div>
</section>
</body>
</html>
