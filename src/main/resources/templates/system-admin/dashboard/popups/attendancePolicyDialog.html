<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="system-dialog-backdrop" data-attendance-policy-dialog hidden th:fragment="dialog">
    <form class="system-dialog system-cohort-dialog" role="dialog" aria-modal="true"
          aria-labelledby="attendance-policy-dialog-title" data-attendance-policy-form>
        <header>
            <div>
                <span>ATTENDANCE POLICY</span>
                <h2 id="attendance-policy-dialog-title">출결 정책 설정</h2>
                <p data-policy-dialog-subtitle>정책이 없으면 해당 기수의 체크인이 동작하지 않습니다.</p>
            </div>
            <button type="button" class="system-dialog-close" data-close-dialog aria-label="닫기">×</button>
        </header>

        <p class="system-contract-note" data-policy-unset-note hidden>
            <small>이 기수는 아직 출결 정책이 없습니다. 저장하기 전까지 구성원이 체크인할 수 없습니다.</small>
        </p>

        <div class="system-form-grid">
            <label class="is-wide">
                <span>타임존 *</span>
                <input name="timezone" required placeholder="Asia/Seoul" />
                <small>출결 판정에 쓰는 기준 시간대입니다.</small>
            </label>
            <label>
                <span>출석 시작 시각 *</span>
                <input name="scheduledStartTime" type="time" required />
            </label>
            <label>
                <span>출석 종료 시각 *</span>
                <input name="scheduledEndTime" type="time" required />
            </label>
            <label>
                <span>결석 처리 기준 시각</span>
                <input name="absenceCutoffTime" type="time" />
                <small>비워 두면 결석 자동 판정을 쓰지 않습니다.</small>
            </label>
            <label>
                <span>허용 자리비움 (분) *</span>
                <input name="allowedAwayMinutes" type="number" min="0" step="1" required />
            </label>
        </div>

        <p class="system-form-error" data-attendance-policy-error role="alert" hidden></p>

        <footer>
            <button type="button" class="secondary-button" data-close-dialog>취소</button>
            <button type="submit" class="system-primary-button" data-save-attendance-policy>출결 정책 저장</button>
        </footer>
    </form>
</div>
</body>
</html>
