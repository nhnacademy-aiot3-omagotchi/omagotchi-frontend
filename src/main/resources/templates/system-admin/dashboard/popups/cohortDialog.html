<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="system-dialog-backdrop" data-cohort-dialog hidden th:fragment="dialog">
    <form class="system-dialog system-cohort-dialog" role="dialog" aria-modal="true" aria-labelledby="cohort-dialog-title" data-cohort-form>
        <header><div><span>NEW COHORT</span><h2 id="cohort-dialog-title">새 기수 생성</h2><p>생성된 기수의 최초 상태는 PREPARING입니다.</p></div><button type="button" class="system-dialog-close" data-close-dialog aria-label="닫기">×</button></header>
        <div class="system-form-grid">
            <label class="is-wide"><span>기수 이름 *</span><input name="name" placeholder="예: AIoT 5기" required /></label>
            <label class="is-wide"><span>설명</span><textarea name="description" placeholder="교육 과정과 운영 목적을 입력하세요."></textarea></label>
            <label><span>시작일 *</span><input name="startDate" type="date" required /></label>
            <label><span>종료일 *</span><input name="endDate" type="date" required /></label>
            <label class="is-wide"><span>초기 기수 관리자</span><select name="managerUserId" data-manager-options><option value="">나중에 배정</option></select><small>기수 관리자가 최소 1명 필요합니다.</small></label>
        </div>

        <div class="system-contract-note">
            <small>출결 정책은 기수 생성과 함께 저장됩니다. 정책이 없으면 구성원이 체크인할 수 없어, 저장에 실패하면 기수 생성도 취소됩니다.</small>
        </div>

        <div class="system-form-grid">
            <label class="is-wide"><span>타임존 *</span><input name="policyTimezone" value="Asia/Seoul" required placeholder="Asia/Seoul" /></label>
            <label><span>출석 시작 시각 *</span><input name="policyScheduledStartTime" type="time" value="09:00" required /></label>
            <label><span>출석 종료 시각 *</span><input name="policyScheduledEndTime" type="time" value="18:00" required /></label>
            <label><span>결석 처리 기준 시각</span><input name="policyAbsenceCutoffTime" type="time" value="10:00" /><small>비워 두면 결석 자동 판정을 쓰지 않습니다.</small></label>
            <label><span>허용 자리비움 (분) *</span><input name="policyAllowedAwayMinutes" type="number" min="0" step="1" value="30" required /></label>
        </div>
        <p class="system-form-error" data-cohort-form-error role="alert" hidden></p>
        <footer><button type="button" class="secondary-button" data-close-dialog>취소</button><button type="submit" class="system-primary-button">PREPARING 기수 생성</button></footer>
    </form>
</div>
</body>
</html>
