<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi Write</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" th:href="@{/favicon.png}" />
    <link rel="stylesheet" href="/css/appPages.css" th:href="@{/css/appPages.css}" />
</head>
<body>
<main class="app-page">
    <section class="app-shell">
        <header class="app-topbar">
            <div class="app-title">
                <h1>기록</h1>
                <p>오늘 공부한 내용과 남길 메모를 작성합니다.</p>
            </div>
            <a href="/home">홈으로</a>
        </header>

        <section class="panel">
            <form class="write-form">
                <input type="text" placeholder="제목" aria-label="기록 제목" />
                <textarea placeholder="오늘 배운 내용이나 회고를 적어주세요." aria-label="기록 내용"></textarea>
                <button class="primary-button" type="button">임시 저장</button>
            </form>
        </section>
    </section>
</main>
</body>
</html>
