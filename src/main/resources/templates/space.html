<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi Space</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" th:href="@{/favicon.png}" />
    <link rel="stylesheet" href="/css/gameFont.css" th:href="@{/css/gameFont.css}" />
    <link rel="stylesheet" href="/css/space.css" th:href="@{/css/space.css}" />
    <link rel="stylesheet" href="/css/spaceRoom.css" th:href="@{/css/spaceRoom.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="space-page">
    <section class="space-shell space-shell-v2" aria-labelledby="space-title">
        <header class="space-header">
            <div>
                <h1 id="space-title">공간</h1>
                <p>담당 실습실과 사용할 수 있는 회의실·도서관을 확인합니다.</p>
            </div>
            <a href="/home">홈으로</a>
        </header>
        <div class="space-room-app" data-space-room-app></div>
        <noscript>
            <section>
                <h2>회의실 A</h2>
                <p>공간 현황을 확인하려면 브라우저에서 JavaScript를 활성화해 주세요.</p>
            </section>
        </noscript>
    </section>
</main>

<script src="/js/spaceRoom.js" th:src="@{/js/spaceRoom.js}"></script>
<script src="/js/space.js" th:src="@{/js/space.js}"></script>
<script src="/js/scrollCue.js" th:src="@{/js/scrollCue.js}"></script>
</body>
</html>
