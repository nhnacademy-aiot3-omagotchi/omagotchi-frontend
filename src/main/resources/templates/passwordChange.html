<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi 비밀번호 변경</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/auth.css" th:href="@{/css/auth.css}" />
    <link rel="stylesheet" href="/css/passwordToggle.css" th:href="@{/css/passwordToggle.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="login-page auth-page">
    <section class="login-card auth-card password-card" aria-labelledby="password-title">
        <header class="auth-card-header">
            <a class="auth-back-link" href="/login" aria-label="로그인으로 돌아가기">←</a>
            <p class="auth-brand">omagotchi</p>
        </header>

        <form class="auth-form password-change-form auth-panel" action="#" method="post">
            <h1 id="password-title" data-password-title>비밀번호 초기화</h1>
            <p class="auth-subtitle" data-auth-feedback>비밀번호 재설정 기능은 아직 준비 중입니다.</p>

            <div class="password-step is-active" data-password-step="lookup">
                <label class="input-group auth-input-group">
                    <span class="sr-only">이메일</span>
                    <input type="email" name="email" placeholder="이메일" autocomplete="username" />
                </label>

                <a class="password-back-link" href="/login">← 로그인으로 돌아가기</a>

                <button class="auth-button auth-submit-button" type="button" data-check-user-button>
                    이메일 확인하기
                </button>
            </div>

            <div class="password-step" data-password-step="change" aria-hidden="true">
                <div class="input-group auth-input-group">
                    <label class="sr-only" for="new-password">새 비밀번호</label>
                    <div class="password-input-wrap">
                        <input id="new-password" type="password" name="newPassword" placeholder="새 비밀번호" autocomplete="new-password" />
                        <button class="password-visibility-toggle" type="button" data-password-toggle
                                aria-label="새 비밀번호 표시" aria-pressed="false">
                            <span class="password-eye" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <div class="input-group auth-input-group">
                    <label class="sr-only" for="confirm-password">새 비밀번호 확인</label>
                    <div class="password-input-wrap">
                        <input id="confirm-password" type="password" name="confirmPassword" placeholder="새 비밀번호 확인" autocomplete="new-password" />
                        <button class="password-visibility-toggle" type="button" data-password-toggle
                                aria-label="새 비밀번호 확인 표시" aria-pressed="false">
                            <span class="password-eye" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <button class="auth-button auth-submit-button" type="submit">
                    비밀번호 변경
                </button>
            </div>
        </form>
    </section>
</main>

<script src="/js/api.js" th:src="@{/js/api.js}"></script>
<script src="/js/passwordChange.js" th:src="@{/js/passwordChange.js}"></script>
<script src="/js/passwordToggle.js" th:src="@{/js/passwordToggle.js}"></script>
</body>
</html>
