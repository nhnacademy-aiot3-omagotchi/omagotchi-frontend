<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi Progress</title>
    <link rel="icon" type="image/gif" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/appPages.css" th:href="@{/css/appPages.css}" />
    <link rel="stylesheet" href="/css/progress.css?v=20260902-3" th:href="@{/css/progress.css(v='20260902-3')}" />
    <link rel="stylesheet" href="/css/serviceIntegrationState.css" th:href="@{/css/serviceIntegrationState.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="app-page">
    <section class="app-shell progress-shell">
        <header class="app-topbar">
            <div class="app-title">
                <h1>진행</h1>
                <p>오늘의 퀘스트, 업적, 랭킹 흐름을 한 곳에서 확인합니다.</p>
            </div>
            <a href="/home">홈으로</a>
        </header>

        <section class="panel progress-panel">
            <div class="panel-header">
                <h2 data-progress-title>오늘의 퀘스트</h2>
                <div class="tabs progress-tabs" aria-label="진행 탭">
                    <button type="button" class="is-active" data-progress-tab="quests">퀘스트</button>
                    <button type="button" data-progress-tab="achievements">업적</button>
                    <button type="button" data-progress-tab="leaders">랭킹</button>
                    <button type="button" data-progress-tab="timeline">타임라인</button>
                    <button type="button" data-progress-tab="stats">통계</button>
                </div>
            </div>

            <section class="progress-view is-active" data-progress-view="quests" aria-label="퀘스트">
                <div class="progress-section-label">
                    <strong>일일</strong>
                    <span data-claim-indicator></span>
                    <em>익일 4시에 초기화</em>
                </div>
                <div class="task-list" data-progress-quests>
                    <article class="task-item quest-item">
                        <div><h3>퀘스트를 불러오는 중입니다.</h3><p>잠시만 기다려 주세요.</p></div>
                    </article>
                </div>
            </section>

            <section class="progress-view" data-progress-view="achievements" aria-label="업적" hidden>
                <th:block th:replace="~{fragments/service-integration-pending :: state(
                    title='서비스 연동 대기',
                    description='업적 API가 연결되면 실제 달성 기록을 표시합니다.'
                )}"></th:block>
            </section>

            <section class="progress-view" data-progress-view="leaders" aria-label="랭킹" hidden>
                <div class="ranking-filter-bar">
                    <div class="ranking-period-tabs" role="tablist" aria-label="랭킹 기간">
                        <button class="is-active" type="button" role="tab" aria-selected="true" data-ranking-period="TODAY">오늘</button>
                        <button type="button" role="tab" aria-selected="false" data-ranking-period="WEEKLY">이번 주</button>
                        <button type="button" role="tab" aria-selected="false" data-ranking-period="MONTHLY">이번 달</button>
                    </div>
                    <label class="ranking-date-field" data-ranking-date-field>
                        <span>지난 날짜</span>
                        <input type="date" data-ranking-date aria-label="과거 일간 랭킹 날짜" />
                    </label>
                    <span data-ranking-meta>불러오는 중</span>
                </div>
                <p class="ranking-aggregation-note">주간·월간 랭킹은 완료된 집계일까지만 반영됩니다. 오늘 기록은 ‘오늘’ 랭킹에서 확인할 수 있습니다.</p>
                <ol class="leader-list" aria-label="학습 시간 랭킹" data-progress-ranking>
                    <li data-empty-ranking><strong>-</strong><span>랭킹을 불러오는 중입니다.</span><em>대기</em></li>
                </ol>
                <div class="ranking-my-card" data-progress-my-ranking hidden></div>
            </section>

            <section class="progress-view" data-progress-view="timeline" aria-label="타임라인" hidden>
                <th:block th:replace="~{fragments/service-integration-pending :: state(
                    title='서비스 연동 대기',
                    description='활동 이력 API가 연결되면 실제 출석과 학습 기록을 시간순으로 표시합니다.'
                )}"></th:block>
            </section>

            <section class="progress-view" data-progress-view="stats" aria-label="통계" hidden>
                <div class="stat-grid" data-progress-stats>
                    <article class="stat-card">
                        <h3>학습 통계</h3>
                        <strong>불러오는 중</strong>
                        <p>서버 기록을 확인하고 있습니다.</p>
                    </article>
                </div>
            </section>
        </section>
    </section>
</main>
<script src="/js/api.js" th:src="@{/js/api.js}"></script>
<script type="module" src="/js/progress.js?v=20260903-1" th:src="@{/js/progress.js(v='20260903-1')}"></script>
</body>
</html>
