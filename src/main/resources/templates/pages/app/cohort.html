<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi Cohort</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/appPages.css" th:href="@{/css/appPages.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="app-page">
    <section class="app-shell">
        <header class="app-topbar">
            <div class="app-title">
                <h1>기수</h1>
                <p>현재 승인되어 참여 중인 기수를 확인합니다.</p>
            </div>
            <a href="/home">홈으로</a>
        </header>

        <section class="panel">
            <div class="panel-header">
                <h2>기수 현황</h2>
                <span class="status-pill" data-cohort-status>불러오는 중</span>
            </div>
            <div class="cohort-grid" data-cohort-list>
                <article class="cohort-card">
                    <h3>기수 정보를 불러오는 중입니다.</h3>
                    <p>잠시만 기다려 주세요.</p>
                </article>
            </div>
        </section>
    </section>
</main>
<script src="/js/api.js" th:src="@{/js/api.js}"></script>
<script src="/js/cohort.js" th:src="@{/js/cohort.js}"></script>
</body>
</html>
