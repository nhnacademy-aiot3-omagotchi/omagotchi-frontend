<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi 캐릭터 표시명</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/auth.css" th:href="@{/css/auth.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="login-page auth-page">
    <section class="login-card auth-card username-card" aria-labelledby="username-title">
        <header class="auth-card-header username-header">
            <p class="auth-brand">omagotchi</p>
        </header>

        <!-- Learning Service 게임 프로필 연동 전 캐릭터 표시명 목업 -->
        <!-- 입력 제한은 화면 확인용 임시 기준이며 Learning Service Domain 정책 아님 -->
        <form class="auth-form username-form auth-panel">
            <h1 id="username-title">캐릭터 이름을 정해주세요</h1>
            <p class="auth-subtitle username-feedback" data-auth-feedback>2~16자의 한글·영문·숫자</p>

            <label class="input-group auth-input-group username-input-group">
                <span class="sr-only">캐릭터 표시명</span>
                <input
                        type="text"
                        name="username"
                        placeholder="캐릭터 표시명"
                        autocomplete="nickname"
                        minlength="2"
                        maxlength="16"
                        pattern="[0-9A-Za-z가-힣]{2,16}"
                        required
                />
            </label>

            <button class="auth-button auth-submit-button" type="submit">
                입력하기
            </button>
        </form>
    </section>
</main>

<script src="/js/username.js" th:src="@{/js/username.js}"></script>
</body>
</html>
