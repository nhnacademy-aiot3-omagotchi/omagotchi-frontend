<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi 로그인</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/gameFont.css" th:href="@{/css/gameFont.css}" />
    <link rel="stylesheet" href="/css/ui/design-system.css?v=20260814-2" th:href="@{/css/ui/design-system.css(v='20260814-2')}" />
    <link rel="stylesheet" href="/css/auth.css?v=20260814-1" th:href="@{/css/auth.css(v='20260814-1')}" />
    <link rel="stylesheet" href="/css/passwordToggle.css" th:href="@{/css/passwordToggle.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="login-page auth-page">
    <section class="login-card auth-card ui-auth-shell" aria-labelledby="login-title">
        <aside class="ui-auth-aside" aria-label="오마고치 서비스 소개">
            <a class="auth-back-link" href="/" aria-label="인덱스로 돌아가기">←</a>
            <div>
                <p class="auth-brand ui-auth-brand">omagotchi</p>
                <h2>오늘의 집중을<br />캐릭터 성장으로</h2>
                <p>출석하고 집중 시간을 기록하며 함께 성장하세요.</p>
            </div>
            <div class="ui-auth-aside-badges" aria-label="주요 기능">
                <span>#집중타이머</span><span>#출석기록</span><span>#캐릭터성장</span>
            </div>
        </aside>

        <form class="login-form auth-panel ui-auth-card ui-auth-form" method="post" th:action="@{/login}">
            <h1 id="login-title">환영합니다</h1>
            <p class="auth-subtitle" data-auth-feedback
               th:classappend="${authFeedback != null} ? ' auth-error'"
               th:text="${authFeedback ?: '오마고치와 함께하는 학습'}">오마고치와 함께하는 학습</p>

            <div class="auth-segmented ui-auth-tabs" aria-label="인증 메뉴">
                <span class="is-active ui-auth-tab">로그인</span>
                <a class="ui-auth-tab" href="/register">회원가입</a>
            </div>

            <label class="input-group auth-input-group ui-field">
                <span class="sr-only">이메일</span>
                <input type="email" placeholder="이메일" autocomplete="username"
                       name="email" maxlength="254" required />
            </label>

            <div class="input-group auth-input-group ui-field">
                <label class="sr-only" for="login-password">비밀번호</label>
                <div class="password-input-wrap">
                    <input id="login-password" type="password" name="password" placeholder="비밀번호"
                           autocomplete="current-password" required />
                    <button class="password-visibility-toggle" type="button" data-password-toggle
                            aria-label="비밀번호 표시" aria-pressed="false">
                        <span class="password-eye" aria-hidden="true"></span>
                    </button>
                </div>
            </div>

            <a class="auth-forgot-link" href="/password-change">비밀번호를 잊으셨나요?</a>

            <button class="login-button auth-submit-button ui-button ui-button--primary" type="submit">
                로그인하기
            </button>
        </form>
    </section>
</main>

<script src="/js/login.js" th:src="@{/js/login.js}"></script>
<script src="/js/passwordToggle.js" th:src="@{/js/passwordToggle.js}"></script>
</body>
</html>
