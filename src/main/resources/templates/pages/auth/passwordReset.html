<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Omagotchi 비밀번호 재설정</title>

    <link rel="icon" type="image/gif" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/gameFont.css" th:href="@{/css/gameFont.css}" />
    <link rel="stylesheet" href="/css/ui/design-system.css?v=20260903-1" th:href="@{/css/ui/design-system.css(v='20260903-1')}" />
    <link rel="stylesheet" href="/css/auth.css?v=20260903-1" th:href="@{/css/auth.css(v='20260903-1')}" />
    <link rel="stylesheet" href="/css/passwordToggle.css" th:href="@{/css/passwordToggle.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="login-page auth-page">
    <section class="login-card auth-card ui-auth-shell password-reset-card"
             aria-labelledby="password-reset-title">
        <aside class="ui-auth-aside auth-hero" aria-label="오마고치 소개">
            <a class="auth-back-link" href="/login" aria-label="로그인으로 돌아가기">←</a>

            <div class="auth-hero-stage" aria-hidden="true">
                <img class="auth-hero-character" src="/images/characters/study/study_eye.gif"
                     th:src="@{/images/characters/study/study_eye.gif}" alt="" />
                <span class="auth-hero-shadow"></span>
            </div>

            <div class="auth-hero-copy">
                <p class="auth-brand ui-auth-brand">omagotchi</p>
                <p class="auth-hero-line">다시 만날 준비를 도와드릴게요</p>
            </div>
        </aside>

        <form class="auth-form auth-panel ui-auth-card ui-auth-form password-reset-form"
              data-email-otp-path="/bff/v2/auth/password-reset/email-otp"
              th:data-email-otp-path="@{/bff/v2/auth/password-reset/email-otp}"
              data-password-reset-path="/bff/v2/auth/password-reset"
              th:data-password-reset-path="@{/bff/v2/auth/password-reset}"
              data-login-path="/login?notice=password-reset"
              th:data-login-path="@{/login(notice='password-reset')}"
              novalidate>
            <h1 id="password-reset-title">비밀번호 재설정</h1>
            <p class="auth-subtitle" data-auth-feedback role="status" aria-live="polite">
                가입한 이메일을 입력해 주세요.
            </p>

            <section class="ui-email-verification" data-password-reset-email-step
                     aria-labelledby="password-reset-email-title">
                <h2 class="sr-only" id="password-reset-email-title">이메일 인증번호 발급</h2>

                <div class="input-group auth-input-group ui-field">
                    <label class="sr-only" for="password-reset-email">이메일</label>
                    <input id="password-reset-email" type="email" name="email" placeholder="이메일"
                           autocomplete="username" maxlength="254" required />
                </div>

                <button class="auth-button auth-submit-button ui-button ui-button--primary"
                        type="button" data-password-reset-email-otp-request>
                    인증번호 받기
                </button>
                <!-- TODO: 공개 OTP 발급 악용 방지를 위한 CAPTCHA 검증 연동 -->

                <a class="password-back-link" href="/login">로그인으로 돌아가기</a>
            </section>

            <section class="ui-email-verification password-reset-challenge-step"
                     data-password-reset-challenge-step hidden
                     aria-labelledby="password-reset-challenge-title">
                <div class="ui-email-verification__summary">
                    <p id="password-reset-challenge-title">이메일로 인증번호를 보냈습니다.</p>
                    <strong data-password-reset-email-address></strong>
                </div>

                <div class="input-group auth-input-group ui-field">
                    <label class="sr-only" for="password-reset-code">인증번호</label>
                    <input id="password-reset-code" type="text" name="code" placeholder="6자리 인증번호"
                           inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
                           minlength="6" maxlength="6" aria-describedby="password-reset-timer"
                           required disabled />
                </div>

                <p id="password-reset-timer" class="ui-email-verification__timer">
                    남은 시간 <strong data-password-reset-countdown>--:--</strong>
                </p>

                <div class="input-group auth-input-group ui-field">
                    <label class="sr-only" for="password-reset-new-password">새 비밀번호</label>
                    <div class="password-input-wrap">
                        <input id="password-reset-new-password" type="password" name="newPassword"
                               placeholder="새 비밀번호" autocomplete="new-password"
                               minlength="15" maxlength="64"
                               aria-describedby="password-reset-policy" required disabled />
                        <button class="password-visibility-toggle" type="button" data-password-toggle
                                aria-label="비밀번호 표시" aria-pressed="false">
                            <span class="password-eye" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <div class="input-group auth-input-group ui-field">
                    <label class="sr-only" for="password-reset-confirm-password">새 비밀번호 확인</label>
                    <div class="password-input-wrap">
                        <input id="password-reset-confirm-password" type="password"
                               name="passwordConfirmation" placeholder="새 비밀번호 확인"
                               autocomplete="new-password" minlength="15" maxlength="64"
                               required disabled />
                        <button class="password-visibility-toggle" type="button" data-password-toggle
                                aria-label="비밀번호 확인 표시" aria-pressed="false">
                            <span class="password-eye" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <p id="password-reset-policy" class="password-reset-policy-hint">
                    15~64자로 입력하고 제어 문자는 사용할 수 없습니다.
                </p>

                <button class="auth-button auth-submit-button ui-button ui-button--primary"
                        type="submit" data-password-reset-submit disabled>
                    비밀번호 재설정
                </button>

                <div class="ui-email-verification__resend">
                    <span>메일이 오지 않았나요?</span>
                    <button type="button" data-password-reset-email-otp-resend>인증번호 재전송</button>
                </div>

                <button class="ui-email-verification__edit" type="button"
                        data-password-reset-edit-email>
                    이메일 수정
                </button>
            </section>

            <noscript class="auth-field-error">
                비밀번호를 재설정하려면 JavaScript를 활성화해 주세요.
            </noscript>
        </form>
    </section>
</main>

<script type="module" src="/js/passwordReset.js?v=20260904-1"
        th:src="@{/js/passwordReset.js(v='20260904-1')}"></script>
<script src="/js/passwordToggle.js" th:src="@{/js/passwordToggle.js}"></script>
</body>
</html>
