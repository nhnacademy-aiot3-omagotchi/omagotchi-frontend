<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi 비밀번호 재설정 안내</title>

    <link rel="icon" type="image/gif" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/auth.css" th:href="@{/css/auth.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="login-page auth-page">
    <section class="login-card auth-card password-card" aria-labelledby="password-title">
        <header class="auth-card-header">
            <p class="auth-brand">omagotchi</p>
        </header>

        <section class="auth-panel" aria-labelledby="password-title">
            <h1 id="password-title">비밀번호 재설정</h1>
            <p class="auth-subtitle">비밀번호 재설정 기능은 아직 준비 중입니다.</p>
            <a class="auth-forgot-link" href="/login">로그인으로 돌아가기</a>
        </section>
    </section>
</main>

</body>
</html>
