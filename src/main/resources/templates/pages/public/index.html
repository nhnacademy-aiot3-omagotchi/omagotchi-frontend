<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagotchi</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_11.gif" th:href="@{/favicon_11.gif}" />
    <link rel="stylesheet" href="/css/index.css" th:href="@{/css/index.css}" />
    <link rel="stylesheet" href="/css/gameFont.css" th:href="@{/css/gameFont.css}" />
    <link rel="stylesheet" href="/css/imageProtection.css" th:href="@{/css/imageProtection.css}" />
    <link rel="stylesheet" href="/css/cursor.css" th:href="@{/css/cursor.css}" />
</head>
<body>
<main class="index-page">
    <section class="index-landing" aria-labelledby="index-title">
        <h1 id="index-title">Omagotchi</h1>

        <p class="index-subtitle">
            실습실에서 성장하는 나의 오마고치
        </p>

        <img class="index-character"
             src="/images/characters/default/omagotchi_eye.gif"
             alt="오마고치 캐릭터">

        <p class="index-description">
            출석과 학습 기록으로 캐릭터를 성장시키고<br />
            오늘의 퀘스트를 완료해 보세요.
        </p>

        <form class="index-actions" action="/login" method="get" aria-label="시작 메뉴">
            <button class="index-growth-button" type="submit">
                시작하기
            </button>
        </form>

        <nav class="index-utility" aria-label="기타 메뉴">
            <button type="button" data-open-credits>크레딧 및 라이선스</button>
        </nav>
    </section>
</main>

<div class="credits-backdrop" data-credits-backdrop hidden>
    <section class="credits-dialog"
             role="dialog"
             aria-modal="true"
             aria-labelledby="credits-title"
             tabindex="-1">
        <header>
            <div>
                <span class="credits-kicker">CREDITS</span>
                <h2 id="credits-title">크레딧 및 라이선스</h2>
            </div>
            <button class="credits-close" type="button" data-close-credits aria-label="크레딧 닫기">×</button>
        </header>

        <div class="credits-section">
            <h3>캐릭터 아트워크</h3>
            <p>시로몽 캐릭터, 픽셀 아트 및 애니메이션 © 2026 문재민(m00n)</p>
            <p>본 캐릭터는 저작자가 창작하였으며, Omagotchi 프로젝트에 활용되었습니다.</p>
            <p>등록번호: [제C-2026-040776호]</p>
            <p>작성자의 허가 없는 복제, 수정 및 재배포를 금지합니다.</p>
        </div>
    </section>
</div>

<script src="/js/app.js" th:src="@{/js/app.js}"></script>
<script src="/js/imageProtection.js" th:src="@{/js/imageProtection.js}"></script>
</body>
</html>
