spring:
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
    serviceclient:
      identity-service:
        base-url: http://localhost:8083
      gateway-service:
        base-url: http://localhost:8080
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      connect-timeout: 1s
      timeout: 2s
      ssl:
        enabled: false
  session:
    timeout: PT30M
    data:
      redis:
        namespace: omagotchi:frontend:test:session

server:
  port: 0
  servlet:
    session:
      cookie:
        name: OMAGOTCHI_SESSION
        secure: false

eureka:
  client:
    enabled: false

clients:
  identity:
    username: frontend
    password: test-only-frontend-credential-value

management:
  health:
    redis:
      enabled: false
