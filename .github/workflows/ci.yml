name: PR Check

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test:
    name: Maven Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run Java tests
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Check JavaScript syntax
        run: |
          find src/main/resources/static/js -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      # 문법 검사만으로는 동작 회귀를 못 잡는다.
      # src/test/js 의 회귀 테스트를 함께 돌린다.
      - name: Run JavaScript tests
        run: npm run test:js
